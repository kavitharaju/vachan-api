name: Change-version-before-release

on:
  release:
    types: [created]
  # Allows you to run this workflow manually from the Actions tab
  # but the GITHUB_REF might be not the tag but the branch then
  workflow_dispatch:

jobs:
  get-versiontag-n-update-cogit describe --tags --abbrev=0de:
    runs-on: ubuntu-latest
    steps:
      # Checkout the branch
      - name: checkout
        uses: actions/checkout@v3

      - name: change the version in main.py
        run: |
          VERSION=$(echo $GITHUB_REF | sed 's|.*/v||')
          echo ${VERSION}
          sed -i "s|version=\".*\",|version=\"${VERSION}\",|" app/main.py
          head -n 33 app/main.py | tail -n 4

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actor
          message: 'Bump version automatically on release'
          add: './app/main.py'
          tag: '-a $(git describe --tags --abbrev=0) -m "moving tag to new commit" -f $(git rev-parse HEAD)'
          push: 'origin HEAD:bump-version-on-release --force'
